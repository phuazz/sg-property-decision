name: Study — new launch vs resale

# Manual only. This is a one-off research run, not part of the weekly refresh.
# It runs here rather than locally so URA_ACCESS_KEY never leaves GitHub.
# The script is read-only against URA and commits nothing to the repo.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The study itself is stdlib-only by design. These two are for the A2 location guard
      # alone, which reuses fetch_data's MRT join to report where the surviving comparators
      # sit. Without them A2 still runs and says the drift was not measured.
      - name: Install (A2 location guard only)
        run: python -m pip install --quiet requests pyproj

      - name: Self-test (no key needed)
        run: python scripts/study_launch_vs_resale.py --self-test

      - name: Run study
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: python scripts/study_launch_vs_resale.py --run

      - name: Print full result
        run: cat reviews/launch_vs_resale_result.json

      - name: Test A2 summary
        run: |
          python - <<'PY'
          import json
          r = json.load(open('reviews/launch_vs_resale_result.json'))['test_a2_lease_matched']
          print('
UNMATCHED (test A, all resale):')
          for seg, d in (r.get('unmatched_test_a_for_reference') or {}).items():
              print(f"  {seg}: {d['median']:+.1f}%  n={d['n']}")
          print('
LEASE GRADIENT (new sale vs resale with N years left):')
          for lab, block in (r.get('gradient') or {}).items():
              for seg, d in (block or {}).items():
                  flag = '' if d.get('feasible') else '   INFEASIBLE (below the pre-registered floor)'
                  print(f"  {lab:>6} | {seg}: {d['median']:+.1f}%  n={d['n']}  districts={d['districts']}"
                        f"  mrt={d.get('comparator_median_mrt_m')}m{flag}")
          print('
FREEHOLD CONTROL:')
          for seg, d in ((r.get('freehold_control') or {}).get('FH') or {}).items():
              print(f"  {seg}: {d['median']:+.1f}%  n={d['n']}")
          print('
coverage:', json.dumps(r.get('coverage'), indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-vs-resale-result
          path: reviews/launch_vs_resale_result.json
          if-no-files-found: error
