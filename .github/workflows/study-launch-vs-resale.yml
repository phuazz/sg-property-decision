name: Study — new launch vs resale

# Manual only. This is a one-off research run, not part of the weekly refresh.
# It runs here rather than locally so URA_ACCESS_KEY never leaves GitHub.
# The script is read-only against URA and commits nothing to the repo.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The study itself is stdlib-only by design. These two are for the A2 location guard
      # alone, which reuses fetch_data's MRT join to report where the surviving comparators
      # sit. Without them A2 still runs and says the drift was not measured.
      - name: Install (A2 location guard only)
        run: python -m pip install --quiet requests pyproj

      - name: Self-test (no key needed)
        run: python scripts/study_launch_vs_resale.py --self-test

      # The result. Landed duplicate caveat records are removed before the rows are built (the
      # study reads condominiums and apartments only, so this leaves its rows untouched by
      # construction - the _data block in the output says how many records the step removed).
      - name: Run study
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: python scripts/study_launch_vs_resale.py --run

      - name: Print full result
        run: cat reviews/launch_vs_resale_result.json

      # A comparison run, never the record: the same feed with the exact-duplicate removal widened
      # to every record, which the 2026-10-04 census showed would discard distinct condominium sales.
      # It exists to put a number on what that treatment would have done to the two filed records.
      - name: Run study with the removal widened to all records (comparison only)
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: python scripts/study_launch_vs_resale.py --run --dedup-scope all --out reviews/launch_vs_resale_result_dedup-all.json

      - name: Test A2 summary
        run: python scripts/study_a2_summary.py

      - name: Test C summary
        run: python scripts/study_c_summary.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-vs-resale-result
          path: |
            reviews/launch_vs_resale_result.json
            reviews/launch_vs_resale_result_dedup-all.json
          if-no-files-found: error
